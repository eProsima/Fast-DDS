name: Fast DDS MacOS CI (weekly 2.14.x)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 20 * * 0' # Run at minute 0 on Sunday

jobs:
  weekly-mac-ci-2_14_x:
    strategy:
      fail-fast: false
      matrix:
        security:
          - 'ON'
          - 'OFF'
    uses: eProsima/Fast-DDS/.github/workflows/reusable-mac-ci.yml@2.14.x
    with:
      label: 'weekly-sec-${{ matrix.security }}-mac-ci-2.14.x'
      cmake-args: "-DSECURITY=${{ matrix.security }} -DTHIRDPARTY_Asio=FORCE"
      ctest-args: "-LE xfail"
      fastdds-branch: '2.14.x'
      use-ccache: false
